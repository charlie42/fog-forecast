name: Test, build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'   # the pages carry the forecast from build time, so rebuild as new model runs come in
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # for the step that keeps the schedule alive
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub switches a schedule off after 60 days without a commit. Enabling the workflow again counts as activity.
      - run: gh workflow enable deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: actions/checkout@v7
      - run: node --test
      - run: node prerender.js
      - run: python3 build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
